<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Social card · Palermo in chiaro</title>
<!-- Sorgente della card social: si apre da un server nella cartella del progetto
     (python3 -m http.server 8823) su /scripts/social_card.html e se ne fa una schermata 1200x630 in img/social-card.png -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --inchiostro: #0f2233; --carta: #edf1f0; --maiolica: #3fb6bf; --ocra: #e5b657; --cupola: #ee7766; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--inchiostro); }
  body { font-family: "Public Sans", "Segoe UI", sans-serif; color: var(--carta); position: relative; }
  .marchio { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 16px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 30px; }
  .beta { font-family: "Public Sans", sans-serif; font-weight: 600; font-size: 17px; color: var(--cupola); border: 2px solid var(--cupola); border-radius: 99px; padding: 4px 14px; }
  h1 { position: absolute; left: 64px; top: 158px; width: 610px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 56px; line-height: 1.05; letter-spacing: -0.015em; }
  .sotto { position: absolute; left: 64px; bottom: 56px; width: 600px; }
  .dato { font-size: 27px; line-height: 1.28; color: var(--ocra); font-weight: 600; }
  .fonti { margin-top: 14px; font-size: 20px; color: #9db0bb; }
  svg { position: absolute; right: 56px; top: 58px; width: 456px; height: 514px; }
  svg path { stroke: var(--inchiostro); stroke-width: 3; fill-rule: evenodd; }
  svg text { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 34px; text-anchor: middle; }
</style>
</head>
<body>
  <div class="marchio">Palermo in chiaro <span class="beta">Versione beta</span></div>
  <h1>Come vengono distribuiti i soldi pubblici nelle 8 circoscrizioni di Palermo</h1>
  <div class="sotto">
    <div class="dato" id="dato"></div>
    <div class="fonti">Opere, bilancio, appalti, PNRR e coesione, con le fonti.</div>
  </div>
  <svg id="mappa" viewBox="0 0 1000 1046" aria-hidden="true"></svg>
<script>
(async () => {
  const NS = 'http://www.w3.org/2000/svg';
  const [geo, prof, opere] = await Promise.all(['/data/geo/circoscrizioni.json', '/data/snapshot/profilo_circoscrizioni.json', '/data/snapshot/opere_circoscrizioni.json'].map(u => fetch(u).then(r => r.json())));
  const ROM = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];
  const val = c => prof.valori[String(ROM.indexOf(c) + 1)].residenti;
  const v = ROM.map(val), mn = Math.min(...v), mx = Math.max(...v);
  const c0 = [22, 63, 72], c1 = [126, 210, 216];          // dal verde scuro al verde-azzurro chiaro
  const svg = document.getElementById('mappa');
  ROM.forEach(c => {
    const t = (val(c) - mn) / (mx - mn), rgb = c0.map((x, i) => Math.round(x + (c1[i] - x) * t));
    const p = document.createElementNS(NS, 'path'); p.setAttribute('d', geo.circoscrizioni[c].d); p.style.fill = `rgb(${rgb})`; svg.append(p);
  });
  const SPOSTA = { VIII: [-12, 100] };
  ROM.forEach(c => {
    const g = geo.circoscrizioni[c], d = SPOSTA[c] || [0, 0], t = document.createElementNS(NS, 'text');
    t.setAttribute('x', g.cx + d[0]); t.setAttribute('y', g.cy + d[1] + 12); t.textContent = c;
    const lum = (0.299 * parseInt(svg.querySelector('path:nth-of-type(' + (ROM.indexOf(c) + 1) + ')').style.fill.match(/\d+/g)[0]) + 0.587 * parseInt(svg.querySelector('path:nth-of-type(' + (ROM.indexOf(c) + 1) + ')').style.fill.match(/\d+/g)[1]) + 0.114 * parseInt(svg.querySelector('path:nth-of-type(' + (ROM.indexOf(c) + 1) + ')').style.fill.match(/\d+/g)[2])) / 255;
    t.style.fill = lum > 0.55 ? '#0f2233' : '#ffffff'; svg.append(t);
  });
  const nl = opere.non_localizzato.importo_triennio_eur / opere.totale_palermo.importo_triennio_eur;
  document.getElementById('dato').textContent = `Il ${Math.round(100 * nl)}% dell'importo delle opere programmate non ha una circoscrizione.`;
  await document.fonts.ready; document.body.dataset.pronto = '1';
})();
</script>
</body>
</html>
